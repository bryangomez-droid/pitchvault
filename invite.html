<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Activar cuenta | PITCHVAULT</title>

  <link rel="icon" href="assets/brand/pitchvault-logo.png" />

  <!-- Netlify Identity Widget -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

  <style>
    :root{
      --bg: #06140e;
      --card: rgba(255,255,255,.06);
      --border: rgba(255,255,255,.12);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.68);
      --accent: #7CFFB2;
      --accent2: #F8D34A;
      --shadow: 0 20px 60px rgba(0,0,0,.55);
    }

    *{ box-sizing: border-box; }

    body{
      margin:0;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(900px 600px at 20% 20%, rgba(124,255,178,.18), transparent 55%),
        radial-gradient(800px 520px at 80% 30%, rgba(248,211,74,.14), transparent 60%),
        linear-gradient(180deg, #06140e, #020a06);
      color: var(--text);
    }

    .card{
      width:100%;
      max-width:560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 22px;
      backdrop-filter: blur(12px);
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      margin-bottom:14px;
    }

    .logo{
      width:44px;
      height:44px;
      border-radius:12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.10);
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:contain;
      padding:8px;
    }

    .title{
      font-size: 16px;
      font-weight: 800;
      letter-spacing: .10em;
      margin:0;
    }

    h1{
      margin: 8px 0 8px;
      font-size: 28px;
      line-height: 1.15;
    }

    p{
      margin: 0 0 12px;
      color: var(--muted);
      line-height: 1.5;
      font-size: 14px;
    }

    .actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      margin-top:14px;
    }

    .btn{
      appearance:none;
      border:0;
      cursor:pointer;
      padding: 12px 14px;
      border-radius: 12px;
      font-weight: 800;
      font-size: 14px;
      transition: transform .12s ease, filter .12s ease;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .btn:active{
      transform: scale(.98);
    }

    .btn-primary{
      background: linear-gradient(180deg, rgba(124,255,178,.95), rgba(124,255,178,.70));
      color:#062014;
      box-shadow: 0 12px 26px rgba(124,255,178,.18);
    }

    .btn-secondary{
      background: rgba(255,255,255,.06);
      color: var(--text);
      border: 1px solid rgba(255,255,255,.12);
    }

    .hint{
      margin-top:14px;
      padding-top:14px;
      border-top: 1px solid rgba(255,255,255,.10);
      font-size: 13px;
      color: rgba(255,255,255,.70);
    }

    a{
      color: var(--accent);
      text-decoration:none;
      font-weight:700;
    }
    a:hover{ text-decoration:underline; }

    .small{
      font-size: 12px;
      opacity:.75;
      margin-top:8px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="brand">
      <div class="logo">
        <img src="assets/brand/pitchvault-logo.png" alt="PITCHVAULT" />
      </div>
      <p class="title">PITCHVAULT</p>
    </div>

    <h1>Activar cuenta</h1>
    <p>
      Aquí puedes <b>crear tu contraseña</b> para entrar al panel de administración.
    </p>

    <div class="actions">
      <button class="btn btn-primary" id="btnSignup">Crear contraseña</button>
      <button class="btn btn-secondary" id="btnLogin">Ya tengo cuenta</button>
    </div>

    <div class="hint">
      Después de activar tu cuenta entra al panel aquí:
      <a href="/admin/">/admin</a>
      <div class="small">
        Si abriste un link con <code>#invite_token</code>, esta página lo detecta automáticamente.
      </div>
    </div>
  </div>

  <script>
    // Abre Netlify Identity en modo signup/login
    function openSignup(){
      if (window.netlifyIdentity) window.netlifyIdentity.open("signup");
    }
    function openLogin(){
      if (window.netlifyIdentity) window.netlifyIdentity.open("login");
    }

    document.getElementById("btnSignup").addEventListener("click", openSignup);
    document.getElementById("btnLogin").addEventListener("click", openLogin);

    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        // Si llega un link con invite_token, abre signup automáticamente
        if (window.location.hash.includes("invite_token")) {
          openSignup();
        }
      });

      window.netlifyIdentity.on("login", () => {
        // Cuando loguea, lo mandamos al admin
        window.location.href = "/admin/";
      });

      window.netlifyIdentity.init();
    }
  </script>
</body>
</html>
